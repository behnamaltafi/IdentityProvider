apiVersion: apps/v1
kind: Deployment
metadata:
  name: your-api
  namespace: your-namespace
  labels:
    app.kubernetes.io/name: your-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: your-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: your-api
    spec:
      containers:
        - name: api
          image: registry.example.com/your-team/your-api:your-tag
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ConnectionStrings__ApplicationDbContext
              valueFrom:
                secretKeyRef:
                  name: your-api-secrets
                  key: database-connection-string
                  optional: true
          readinessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: your-api
  namespace: your-namespace
  labels:
    app.kubernetes.io/name: your-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: your-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
